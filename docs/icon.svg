<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3730a3"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="mic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Subtle grid lines -->
  <line x1="0" y1="170" x2="512" y2="170" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <line x1="0" y1="342" x2="512" y2="342" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <line x1="170" y1="0" x2="170" y2="512" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <line x1="342" y1="0" x2="342" y2="512" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <!-- Microphone body -->
  <rect x="196" y="88" width="120" height="188" rx="60" fill="url(#mic)"/>
  <!-- Microphone stand arc -->
  <path d="M148 270 Q148 370 256 370 Q364 370 364 270"
        stroke="url(#mic)" stroke-width="30" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Stem -->
  <line x1="256" y1="370" x2="256" y2="428"
        stroke="url(#mic)" stroke-width="28" stroke-linecap="round"/>
  <!-- Base -->
  <line x1="192" y1="428" x2="320" y2="428"
        stroke="url(#mic)" stroke-width="28" stroke-linecap="round"/>
  <!-- Sound waves right -->
  <path d="M370 200 Q400 230 370 260" stroke="rgba(34,211,238,0.7)" stroke-width="16"
        fill="none" stroke-linecap="round"/>
  <path d="M398 178 Q444 228 398 278" stroke="rgba(34,211,238,0.4)" stroke-width="14"
        fill="none" stroke-linecap="round"/>
</svg>
