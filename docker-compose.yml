services:
  voicechart:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-sk-e7216164cf9c419da7503ce66586a8dd}
      - WHISPER_MODEL=${WHISPER_MODEL:-base}
    restart: unless-stopped
    volumes:
      - whisper_cache:/root/.cache/huggingface

volumes:
  whisper_cache:
