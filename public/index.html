<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>信号定位搜索系统</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 600;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 60px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: 600;
            width: 100%;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .btn-danger {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        #map {
            width: 100%;
            height: 500px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }

        .signals-list {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            max-height: 600px;
            overflow-y: auto;
        }

        .signal-item {
            background: #f8f9fa;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
            transition: transform 0.2s;
        }

        .signal-item:hover {
            transform: translateX(5px);
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .signal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .signal-name {
            font-weight: bold;
            color: #667eea;
            font-size: 1.1em;
        }

        .signal-type {
            background: #667eea;
            color: white;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 0.85em;
        }

        .signal-info {
            color: #666;
            font-size: 0.9em;
            line-height: 1.6;
        }

        .signal-distance {
            color: #764ba2;
            font-weight: bold;
            margin-top: 5px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            color: #666;
            margin-top: 5px;
        }

        .message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        @media (max-width: 968px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .grid-2 {
                grid-template-columns: 1fr;
            }
        }

        .delete-btn {
            background: #f5576c;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.85em;
            margin-left: 10px;
        }

        .delete-btn:hover {
            background: #e04455;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📡 信号定位搜索系统</h1>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="totalSignals">0</div>
                <div class="stat-label">总信号数</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="nearbySignals">0</div>
                <div class="stat-label">附近信号</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="searchRadius">10</div>
                <div class="stat-label">搜索半径 (km)</div>
            </div>
        </div>

        <div id="map"></div>

        <div class="main-content">
            <div class="card">
                <h2>📤 发送新信号</h2>
                <div id="sendMessage" class="message"></div>
                <form id="sendSignalForm">
                    <div class="form-group">
                        <label>信号名称 *</label>
                        <input type="text" id="signalName" required placeholder="例如: WiFi热点A">
                    </div>
                    <div class="form-group">
                        <label>信号类型</label>
                        <select id="signalType">
                            <option value="WiFi">WiFi</option>
                            <option value="蓝牙">蓝牙</option>
                            <option value="GPS">GPS</option>
                            <option value="无线电">无线电</option>
                            <option value="其他">其他</option>
                        </select>
                    </div>
                    <div class="grid-2">
                        <div class="form-group">
                            <label>纬度 *</label>
                            <input type="number" id="signalLat" step="any" required placeholder="例如: 39.9042">
                        </div>
                        <div class="form-group">
                            <label>经度 *</label>
                            <input type="number" id="signalLon" step="any" required placeholder="例如: 116.4074">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>信号强度 (%)</label>
                        <input type="number" id="signalStrength" min="0" max="100" value="100">
                    </div>
                    <div class="form-group">
                        <label>描述</label>
                        <textarea id="signalDescription" placeholder="信号的额外信息..."></textarea>
                    </div>
                    <button type="submit">发送信号</button>
                    <button type="button" class="btn-secondary" onclick="useCurrentLocation()">使用当前位置</button>
                </form>
            </div>

            <div class="card">
                <h2>🔍 搜索附近信号</h2>
                <div id="searchMessage" class="message"></div>
                <form id="searchForm">
                    <div class="grid-2">
                        <div class="form-group">
                            <label>纬度 *</label>
                            <input type="number" id="searchLat" step="any" required placeholder="例如: 39.9042">
                        </div>
                        <div class="form-group">
                            <label>经度 *</label>
                            <input type="number" id="searchLon" step="any" required placeholder="例如: 116.4074">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>搜索半径 (公里)</label>
                        <input type="number" id="searchRadiusInput" min="0.1" step="0.1" value="10">
                    </div>
                    <button type="submit">搜索附近信号</button>
                    <button type="button" class="btn-secondary" onclick="useCurrentLocationForSearch()">使用当前位置搜索</button>
                    <button type="button" class="btn-secondary" onclick="loadAllSignals()">显示所有信号</button>
                    <button type="button" class="btn-danger" onclick="clearAllSignals()">清空所有信号</button>
                </form>
            </div>
        </div>

        <div class="signals-list">
            <h2>📋 信号列表</h2>
            <div id="signalsList"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
