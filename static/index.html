<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VoiceChart — 语音流程图生成器</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #07071a;
  --bg2: #0d0d2b;
  --card: rgba(255,255,255,0.04);
  --card-hover: rgba(255,255,255,0.07);
  --border: rgba(255,255,255,0.08);
  --border-active: rgba(129,140,248,0.5);
  --primary: #818cf8;
  --primary-dim: rgba(129,140,248,0.15);
  --cyan: #22d3ee;
  --cyan-dim: rgba(34,211,238,0.12);
  --green: #34d399;
  --red: #f87171;
  --amber: #fbbf24;
  --text: #f1f5f9;
  --muted: #94a3b8;
  --muted2: #64748b;
  --radius: 14px;
  --radius-sm: 8px;
  --shadow: 0 4px 24px rgba(0,0,0,0.4);
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 60% 40% at 15% 20%, rgba(129,140,248,0.12) 0%, transparent 60%),
    radial-gradient(ellipse 50% 40% at 85% 70%, rgba(34,211,238,0.08) 0%, transparent 60%),
    radial-gradient(ellipse 40% 30% at 50% 100%, rgba(129,140,248,0.06) 0%, transparent 50%);
  pointer-events: none;
  z-index: 0;
}

.app { position: relative; z-index: 1; display: flex; flex-direction: column; min-height: 100vh; }

/* ── Header ── */
header {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 20px 32px;
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(20px);
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(7,7,26,0.8);
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
}

.logo-icon {
  width: 36px;
  height: 36px;
  background: linear-gradient(135deg, var(--primary), var(--cyan));
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
}

.logo-text {
  font-size: 20px;
  font-weight: 700;
  background: linear-gradient(135deg, var(--primary), var(--cyan));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.logo-sub {
  font-size: 11px;
  color: var(--muted);
  font-weight: 400;
  margin-left: 2px;
  -webkit-text-fill-color: var(--muted);
}

/* Style Selector */
.style-bar {
  display: flex;
  gap: 8px;
  padding: 14px 32px;
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
  scrollbar-width: none;
}
.style-bar::-webkit-scrollbar { display: none; }

.style-pill {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 8px 16px;
  border-radius: 100px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--muted);
  cursor: pointer;
  white-space: nowrap;
  font-size: 13px;
  font-weight: 500;
  transition: all 0.2s;
  user-select: none;
}

.style-pill:hover {
  border-color: var(--border-active);
  background: var(--primary-dim);
  color: var(--primary);
}

.style-pill.active {
  border-color: var(--primary);
  background: var(--primary-dim);
  color: var(--primary);
  box-shadow: 0 0 16px rgba(129,140,248,0.2);
}

.style-pill .pill-icon {
  font-style: normal;
  font-size: 14px;
  opacity: 0.8;
}

/* ── Main Workspace ── */
.workspace {
  flex: 1;
  display: grid;
  grid-template-columns: 420px 1fr;
  gap: 0;
  overflow: hidden;
  height: calc(100vh - 120px);
}

/* ── Left Panel ── */
.left-panel {
  display: flex;
  flex-direction: column;
  gap: 0;
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 24px;
  gap: 16px;
}

/* Mic Section */
.mic-section {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  padding: 28px 20px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}

.mic-ring-wrapper {
  position: relative;
  width: 120px;
  height: 120px;
}

.mic-ring {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 2px solid var(--primary);
  opacity: 0;
  transform: scale(1);
  transition: opacity 0.3s;
}

.mic-ring.pulse {
  animation: ringPulse 1.5s ease-out infinite;
}

@keyframes ringPulse {
  0% { transform: scale(1); opacity: 0.7; }
  100% { transform: scale(1.6); opacity: 0; }
}

.mic-ring:nth-child(2).pulse { animation-delay: 0.5s; }
.mic-ring:nth-child(3).pulse { animation-delay: 1s; }

.mic-btn {
  position: absolute;
  inset: 10px;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 36px;
  transition: all 0.25s;
  background: linear-gradient(135deg, #3730a3, #1e3a8a);
  box-shadow: 0 0 30px rgba(129,140,248,0.3), inset 0 1px 0 rgba(255,255,255,0.1);
  outline: none;
}

.mic-btn:hover {
  transform: scale(1.05);
  box-shadow: 0 0 40px rgba(129,140,248,0.5), inset 0 1px 0 rgba(255,255,255,0.15);
}

.mic-btn.listening {
  background: linear-gradient(135deg, #dc2626, #991b1b);
  box-shadow: 0 0 30px rgba(239,68,68,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
  animation: micPulse 1s ease-in-out infinite;
}

@keyframes micPulse {
  0%, 100% { box-shadow: 0 0 30px rgba(239,68,68,0.4), inset 0 1px 0 rgba(255,255,255,0.1); }
  50% { box-shadow: 0 0 50px rgba(239,68,68,0.7), inset 0 1px 0 rgba(255,255,255,0.15); }
}

.mic-status {
  font-size: 13px;
  color: var(--muted);
  font-weight: 500;
  letter-spacing: 0.02em;
}

.mic-status.listening { color: #f87171; }
.mic-status.processing { color: var(--amber); }
.mic-status.done { color: var(--green); }

/* Waveform */
.waveform {
  display: flex;
  align-items: center;
  gap: 3px;
  height: 32px;
  opacity: 0;
  transition: opacity 0.3s;
}

.waveform.active { opacity: 1; }

.wave-bar {
  width: 3px;
  border-radius: 2px;
  background: var(--primary);
  height: 6px;
  transition: height 0.1s;
}

.waveform.active .wave-bar {
  animation: waveAnim 0.8s ease-in-out infinite;
}

.wave-bar:nth-child(1) { animation-delay: 0s; }
.wave-bar:nth-child(2) { animation-delay: 0.08s; }
.wave-bar:nth-child(3) { animation-delay: 0.16s; }
.wave-bar:nth-child(4) { animation-delay: 0.24s; }
.wave-bar:nth-child(5) { animation-delay: 0.32s; }
.wave-bar:nth-child(6) { animation-delay: 0.4s; }
.wave-bar:nth-child(7) { animation-delay: 0.32s; }
.wave-bar:nth-child(8) { animation-delay: 0.24s; }
.wave-bar:nth-child(9) { animation-delay: 0.16s; }
.wave-bar:nth-child(10) { animation-delay: 0.08s; }

@keyframes waveAnim {
  0%, 100% { height: 4px; }
  50% { height: 28px; }
}

/* Text Area */
.text-section {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.section-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.text-area {
  width: 100%;
  min-height: 110px;
  padding: 12px 14px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-family: inherit;
  font-size: 14px;
  line-height: 1.6;
  resize: vertical;
  outline: none;
  transition: border-color 0.2s;
}

.text-area::placeholder { color: var(--muted2); }
.text-area:focus { border-color: var(--border-active); }

.interim-text {
  color: var(--muted);
  font-style: italic;
  font-size: 13px;
  padding: 8px 12px;
  background: rgba(129,140,248,0.06);
  border-radius: 6px;
  border-left: 2px solid var(--primary);
  min-height: 36px;
  display: none;
}

.interim-text.visible { display: block; }

/* Action Buttons */
.actions {
  display: flex;
  gap: 10px;
}

.btn {
  padding: 10px 20px;
  border-radius: var(--radius-sm);
  border: none;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 8px;
  outline: none;
  white-space: nowrap;
}

.btn-primary {
  background: linear-gradient(135deg, var(--primary), #6366f1);
  color: white;
  flex: 1;
  justify-content: center;
  box-shadow: 0 4px 16px rgba(129,140,248,0.3);
}

.btn-primary:hover:not(:disabled) {
  transform: translateY(-1px);
  box-shadow: 0 6px 24px rgba(129,140,248,0.45);
}

.btn-primary:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.btn-ghost {
  background: var(--card);
  color: var(--muted);
  border: 1px solid var(--border);
}

.btn-ghost:hover {
  background: var(--card-hover);
  color: var(--text);
  border-color: rgba(255,255,255,0.15);
}

/* Lang toggle */
.lang-toggle {
  display: flex;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 100px;
  padding: 3px;
  gap: 2px;
}

.lang-btn {
  padding: 4px 12px;
  border-radius: 100px;
  border: none;
  background: transparent;
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}

.lang-btn.active {
  background: var(--primary-dim);
  color: var(--primary);
}

/* ── Right Panel ── */
.right-panel {
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* Code / Preview Tabs */
.panel-tabs {
  display: flex;
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  gap: 0;
  align-items: center;
}

.tab {
  padding: 14px 20px;
  border-bottom: 2px solid transparent;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.2s;
  user-select: none;
}

.tab:hover { color: var(--text); }

.tab.active {
  color: var(--primary);
  border-bottom-color: var(--primary);
}

.tab-spacer { flex: 1; }

.panel-actions {
  display: flex;
  gap: 8px;
  align-items: center;
}

.icon-btn {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--muted);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  transition: all 0.2s;
  outline: none;
}

.icon-btn:hover {
  background: var(--card-hover);
  color: var(--text);
  border-color: rgba(255,255,255,0.15);
}

/* Code Editor */
.code-pane {
  flex: 1;
  overflow: hidden;
  display: none;
  flex-direction: column;
}

.code-pane.active { display: flex; }

.code-editor {
  flex: 1;
  padding: 20px 24px;
  background: transparent;
  border: none;
  color: var(--cyan);
  font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
  font-size: 13px;
  line-height: 1.7;
  resize: none;
  outline: none;
  overflow-y: auto;
}

.code-editor::placeholder { color: var(--muted2); }

/* Preview */
.preview-pane {
  flex: 1;
  overflow: hidden;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
  position: relative;
}

.preview-pane.active { display: flex; }

.preview-placeholder {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  color: var(--muted2);
  text-align: center;
}

.preview-placeholder .big-icon {
  font-size: 64px;
  opacity: 0.3;
}

.preview-placeholder p {
  font-size: 14px;
  max-width: 260px;
  line-height: 1.6;
}

#diagram-container {
  width: 100%;
  height: 100%;
  overflow: auto;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 16px;
}

#diagram-container svg {
  max-width: 100%;
  height: auto;
  filter: drop-shadow(0 4px 24px rgba(0,0,0,0.5));
  border-radius: 8px;
}

/* Loading overlay */
.loading-overlay {
  position: absolute;
  inset: 0;
  background: rgba(7,7,26,0.85);
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  backdrop-filter: blur(4px);
  z-index: 10;
}

.loading-overlay.visible { display: flex; }

.spinner {
  width: 48px;
  height: 48px;
  border: 3px solid var(--border);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.loading-text {
  font-size: 14px;
  color: var(--muted);
  font-weight: 500;
}

/* Error / Success toast */
.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  padding: 12px 20px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 10px;
  z-index: 1000;
  transform: translateY(80px);
  opacity: 0;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  max-width: 360px;
  box-shadow: var(--shadow);
}

.toast.show {
  transform: translateY(0);
  opacity: 1;
}

.toast.success {
  background: rgba(52,211,153,0.15);
  border: 1px solid rgba(52,211,153,0.3);
  color: var(--green);
}

.toast.error {
  background: rgba(248,113,113,0.15);
  border: 1px solid rgba(248,113,113,0.3);
  color: var(--red);
}

.toast.info {
  background: rgba(129,140,248,0.15);
  border: 1px solid rgba(129,140,248,0.3);
  color: var(--primary);
}

/* Tips */
.tips {
  padding: 10px 14px;
  background: rgba(34,211,238,0.06);
  border: 1px solid rgba(34,211,238,0.15);
  border-radius: var(--radius-sm);
  font-size: 12px;
  color: var(--muted);
  line-height: 1.6;
}

.tips strong { color: var(--cyan); }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

/* Responsive */
@media (max-width: 900px) {
  .workspace { grid-template-columns: 1fr; height: auto; }
  .left-panel { border-right: none; border-bottom: 1px solid var(--border); }
  .right-panel { height: 60vh; }
}
</style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <header>
    <div class="logo">
      <div class="logo-icon">🎤</div>
      <div>
        <div class="logo-text">VoiceChart<span class="logo-sub"> 语音流程图</span></div>
      </div>
    </div>
    <div style="flex:1"></div>
    <div class="lang-toggle">
      <button class="lang-btn active" onclick="setLang('zh-CN')">中文</button>
      <button class="lang-btn" onclick="setLang('en-US')">EN</button>
    </div>
  </header>

  <!-- Style Selector -->
  <div class="style-bar" id="styleBar"></div>

  <!-- Workspace -->
  <div class="workspace">

    <!-- Left Panel -->
    <div class="left-panel">

      <!-- Mic Section -->
      <div class="mic-section">
        <div class="mic-ring-wrapper">
          <div class="mic-ring" id="ring1"></div>
          <div class="mic-ring" id="ring2"></div>
          <div class="mic-ring" id="ring3"></div>
          <button class="mic-btn" id="micBtn" onclick="toggleMic()" title="点击开始/停止录音">
            🎤
          </button>
        </div>
        <div class="waveform" id="waveform">
          <div class="wave-bar"></div><div class="wave-bar"></div>
          <div class="wave-bar"></div><div class="wave-bar"></div>
          <div class="wave-bar"></div><div class="wave-bar"></div>
          <div class="wave-bar"></div><div class="wave-bar"></div>
          <div class="wave-bar"></div><div class="wave-bar"></div>
        </div>
        <div class="mic-status" id="micStatus">点击麦克风开始说话</div>
      </div>

      <!-- Interim / Recognized Text -->
      <div class="text-section">
        <div class="section-label">
          <span>识别内容</span>
          <span id="charCount" style="color:var(--muted2);font-size:11px"></span>
        </div>
        <div class="interim-text" id="interimText"></div>
        <textarea
          class="text-area"
          id="speechText"
          placeholder="语音识别结果会出现在这里，也可以直接在此输入文字描述..."
          oninput="onTextInput()"
        ></textarea>
      </div>

      <!-- Actions -->
      <div class="actions">
        <button class="btn btn-primary" id="generateBtn" onclick="generate()" disabled>
          <span id="generateIcon">✦</span>
          <span id="generateLabel">生成图表</span>
        </button>
        <button class="btn btn-ghost" onclick="clearAll()" title="清空">⊘</button>
      </div>

      <!-- Tips -->
      <div class="tips">
        <strong>示例描述：</strong><br>
        "用户登录系统，输入账号密码，系统验证通过后跳转到首页，验证失败提示重新输入"<br><br>
        <strong>提示：</strong>Chrome/Edge 浏览器支持语音识别，需允许麦克风权限
      </div>

    </div>

    <!-- Right Panel -->
    <div class="right-panel">

      <!-- Tabs -->
      <div class="panel-tabs">
        <div class="tab active" onclick="switchTab('preview')">预览</div>
        <div class="tab" onclick="switchTab('code')">Mermaid 代码</div>
        <div class="tab-spacer"></div>
        <div class="panel-actions">
          <button class="icon-btn" onclick="copyCode()" title="复制代码">⎘</button>
          <button class="icon-btn" onclick="exportSVG()" title="导出 SVG">↓</button>
          <button class="icon-btn" onclick="zoomFit()" title="适应窗口">⊡</button>
        </div>
      </div>

      <!-- Preview Pane -->
      <div class="preview-pane active" id="previewPane">
        <div class="preview-placeholder" id="placeholder">
          <div class="big-icon">📊</div>
          <p>对着麦克风描述你的流程，AI 将自动生成对应的图表</p>
        </div>
        <div id="diagram-container" style="display:none"></div>
        <div class="loading-overlay" id="loadingOverlay">
          <div class="spinner"></div>
          <div class="loading-text">DeepSeek 正在生成图表...</div>
        </div>
      </div>

      <!-- Code Pane -->
      <div class="code-pane" id="codePane">
        <textarea
          class="code-editor"
          id="codeEditor"
          placeholder="Mermaid 代码将在生成后显示在这里，你也可以直接编辑..."
          oninput="onCodeEdit()"
          spellcheck="false"
        ></textarea>
      </div>

    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script type="module">
import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

mermaid.initialize({
  startOnLoad: false,
  theme: 'dark',
  themeVariables: {
    background: '#07071a',
    primaryColor: '#3730a3',
    primaryTextColor: '#f1f5f9',
    primaryBorderColor: '#818cf8',
    lineColor: '#818cf8',
    secondaryColor: '#1e3a5f',
    tertiaryColor: '#0f2040',
    clusterBkg: 'rgba(129,140,248,0.05)',
    clusterBorder: 'rgba(129,140,248,0.3)',
    edgeLabelBackground: '#0d0d2b',
    nodeTextColor: '#f1f5f9',
    fontFamily: 'Inter, system-ui, sans-serif',
  },
  flowchart: { curve: 'basis', padding: 20 },
  sequence: { actorMargin: 60, mirrorActors: false },
});

window._mermaid = mermaid;

// ── State ──
const state = {
  style: 'flowchart',
  lang: 'zh-CN',
  listening: false,
  recognition: null,
  finalText: '',
  renderCount: 0,
};

// ── Styles Config ──
const STYLES = [
  { id: 'flowchart', name: '流程图',    icon: '⬡' },
  { id: 'sequence',  name: '时序图',    icon: '↔' },
  { id: 'mindmap',   name: '思维导图',  icon: '✦' },
  { id: 'class',     name: '类图',      icon: '◫' },
  { id: 'state',     name: '状态图',    icon: '◈' },
  { id: 'er',        name: 'ER 图',     icon: '⊞' },
  { id: 'gantt',     name: '甘特图',    icon: '▦' },
  { id: 'pie',       name: '饼图',      icon: '◔' },
];

// ── Init Style Bar ──
function initStyleBar() {
  const bar = document.getElementById('styleBar');
  bar.innerHTML = STYLES.map(s => `
    <button class="style-pill${s.id === state.style ? ' active' : ''}"
      onclick="selectStyle('${s.id}')"
      title="${s.id}">
      <i class="pill-icon">${s.icon}</i>${s.name}
    </button>
  `).join('');
}

window.selectStyle = (id) => {
  state.style = id;
  document.querySelectorAll('.style-pill').forEach(p => p.classList.remove('active'));
  document.querySelector(`.style-pill[onclick*="${id}"]`)?.classList.add('active');
};

// ── Speech Recognition ──
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

function setupRecognition() {
  if (!SpeechRecognition) {
    document.getElementById('micBtn').title = '浏览器不支持语音识别，请使用 Chrome/Edge';
    document.getElementById('micBtn').style.opacity = '0.5';
    document.getElementById('micStatus').textContent = '浏览器不支持语音识别';
    return;
  }

  const rec = new SpeechRecognition();
  rec.lang = state.lang;
  rec.continuous = true;
  rec.interimResults = true;
  rec.maxAlternatives = 1;

  rec.onstart = () => {
    state.listening = true;
    setMicState(true);
  };

  rec.onresult = (e) => {
    let interim = '';
    let finalAdded = '';

    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) {
        finalAdded += t;
      } else {
        interim += t;
      }
    }

    if (finalAdded) {
      state.finalText += (state.finalText ? '，' : '') + finalAdded.trim();
      document.getElementById('speechText').value = state.finalText;
      onTextInput();
    }

    const interimEl = document.getElementById('interimText');
    if (interim) {
      interimEl.textContent = interim;
      interimEl.classList.add('visible');
    } else {
      interimEl.classList.remove('visible');
      interimEl.textContent = '';
    }
  };

  rec.onerror = (e) => {
    if (e.error === 'not-allowed') {
      showToast('请允许浏览器访问麦克风', 'error');
    } else if (e.error !== 'aborted') {
      showToast(`语音识别错误: ${e.error}`, 'error');
    }
    stopMic();
  };

  rec.onend = () => {
    if (state.listening) {
      try { rec.start(); } catch(err) { stopMic(); }
    }
  };

  state.recognition = rec;
}

function stopMic() {
  state.listening = false;
  setMicState(false);
  document.getElementById('interimText').classList.remove('visible');
}

function setMicState(on) {
  const btn = document.getElementById('micBtn');
  const status = document.getElementById('micStatus');
  const waveform = document.getElementById('waveform');
  const rings = [document.getElementById('ring1'), document.getElementById('ring2'), document.getElementById('ring3')];

  if (on) {
    btn.classList.add('listening');
    btn.textContent = '⏹';
    status.textContent = '正在聆听... 点击停止';
    status.className = 'mic-status listening';
    waveform.classList.add('active');
    rings.forEach(r => r.classList.add('pulse'));
  } else {
    btn.classList.remove('listening');
    btn.textContent = '🎤';
    status.className = 'mic-status';
    waveform.classList.remove('active');
    rings.forEach(r => r.classList.remove('pulse'));
    const hasText = document.getElementById('speechText').value.trim();
    status.textContent = hasText ? '识别完成，可以生成图表' : '点击麦克风开始说话';
    if (hasText) status.className = 'mic-status done';
  }
}

window.toggleMic = () => {
  if (!SpeechRecognition) {
    showToast('当前浏览器不支持语音识别，请使用 Chrome 或 Edge', 'error');
    return;
  }
  if (state.listening) {
    state.listening = false;
    state.recognition?.stop();
    stopMic();
  } else {
    setupRecognition();
    state.finalText = document.getElementById('speechText').value;
    try {
      state.recognition.start();
    } catch(e) {
      setupRecognition();
      state.recognition.start();
    }
  }
};

window.setLang = (lang) => {
  state.lang = lang;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`.lang-btn[onclick*="${lang}"]`)?.classList.add('active');
  if (state.recognition) state.recognition.lang = lang;
  if (state.listening) {
    state.recognition?.stop();
    setTimeout(() => {
      setupRecognition();
      state.recognition.start();
    }, 300);
  }
};

// ── Text Input ──
window.onTextInput = () => {
  const text = document.getElementById('speechText').value.trim();
  const btn = document.getElementById('generateBtn');
  btn.disabled = !text;
  const count = document.getElementById('charCount');
  count.textContent = text.length > 0 ? `${text.length} 字` : '';
};

// ── Generate ──
window.generate = async () => {
  const text = document.getElementById('speechText').value.trim();
  if (!text) return;

  showLoading(true);
  setGenerating(true);

  try {
    const res = await fetch('/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, style: state.style }),
    });

    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || '生成失败');

    document.getElementById('codeEditor').value = data.code;
    await renderDiagram(data.code);
    showToast('图表生成成功！', 'success');

  } catch (err) {
    showToast(err.message, 'error');
  } finally {
    showLoading(false);
    setGenerating(false);
  }
};

// ── Mermaid Render ──
async function renderDiagram(code) {
  if (!code?.trim()) return;

  const container = document.getElementById('diagram-container');
  const placeholder = document.getElementById('placeholder');

  const id = 'md-' + (++state.renderCount);

  try {
    const { svg } = await window._mermaid.render(id, code);
    container.innerHTML = svg;
    container.style.display = 'flex';
    placeholder.style.display = 'none';

    const svgEl = container.querySelector('svg');
    if (svgEl) {
      svgEl.style.maxWidth = '100%';
      svgEl.removeAttribute('height');
    }
  } catch (err) {
    showToast('Mermaid 渲染失败，请检查代码格式', 'error');
    console.error('Mermaid error:', err);
  }
}

// ── Code Editor ──
let codeEditTimer;
window.onCodeEdit = () => {
  clearTimeout(codeEditTimer);
  codeEditTimer = setTimeout(() => {
    const code = document.getElementById('codeEditor').value.trim();
    if (code) renderDiagram(code);
  }, 800);
};

// ── Tabs ──
window.switchTab = (tab) => {
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', (i === 0) === (tab === 'preview'));
  });
  document.getElementById('previewPane').classList.toggle('active', tab === 'preview');
  document.getElementById('codePane').classList.toggle('active', tab === 'code');
};

// ── Export ──
window.copyCode = async () => {
  const code = document.getElementById('codeEditor').value;
  if (!code) { showToast('没有代码可复制', 'info'); return; }
  try {
    await navigator.clipboard.writeText(code);
    showToast('代码已复制到剪贴板', 'success');
  } catch {
    showToast('复制失败', 'error');
  }
};

window.exportSVG = () => {
  const svg = document.querySelector('#diagram-container svg');
  if (!svg) { showToast('请先生成图表', 'info'); return; }
  const blob = new Blob([svg.outerHTML], { type: 'image/svg+xml' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `voicechart-${Date.now()}.svg`;
  a.click();
  showToast('SVG 已下载', 'success');
};

window.zoomFit = () => {
  const svg = document.querySelector('#diagram-container svg');
  if (svg) {
    svg.style.maxWidth = '100%';
    svg.style.width = '100%';
    svg.style.height = 'auto';
  }
};

// ── Clear ──
window.clearAll = () => {
  document.getElementById('speechText').value = '';
  document.getElementById('codeEditor').value = '';
  document.getElementById('interimText').textContent = '';
  document.getElementById('interimText').classList.remove('visible');
  document.getElementById('diagram-container').style.display = 'none';
  document.getElementById('diagram-container').innerHTML = '';
  document.getElementById('placeholder').style.display = 'flex';
  document.getElementById('generateBtn').disabled = true;
  document.getElementById('charCount').textContent = '';
  state.finalText = '';
  if (state.listening) { state.listening = false; state.recognition?.stop(); stopMic(); }
};

// ── UI Helpers ──
function showLoading(on) {
  document.getElementById('loadingOverlay').classList.toggle('visible', on);
}

function setGenerating(on) {
  const btn = document.getElementById('generateBtn');
  const icon = document.getElementById('generateIcon');
  const label = document.getElementById('generateLabel');
  btn.disabled = on;
  icon.textContent = on ? '⟳' : '✦';
  label.textContent = on ? '生成中...' : '生成图表';
  if (on) icon.style.animation = 'spin 0.8s linear infinite';
  else icon.style.animation = '';
}

let toastTimer;
window.showToast = (msg, type = 'info') => {
  const t = document.getElementById('toast');
  const icons = { success: '✓', error: '✕', info: 'ℹ' };
  t.className = `toast ${type}`;
  t.innerHTML = `<span>${icons[type]}</span> ${msg}`;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
};

// ── Keyboard Shortcuts ──
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault();
    if (!document.getElementById('generateBtn').disabled) generate();
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'm') {
    e.preventDefault();
    toggleMic();
  }
});

// ── Init ──
initStyleBar();
</script>
</body>
</html>
